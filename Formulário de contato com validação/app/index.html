<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Formulario</title>
</head>
<body>
    <form action="">
        <fieldset> 
            <legend>Formulario</legend>
            <p>Primeiro nome: <input type="text" name="primeiroNome" id="primeiroNome"></p>
            <p>Sobrenome: <input type="text" name="sobrenome" id="sobrenome"></p>
            <p>E-mail: <input type="email" name="email" id="email"></p>
            <p>Telefone: <input type="tel" name="telefone" id="telefone"></p>
            <p>Endereço: <input type="text" name="endereco" id="endereco"></p>
            <p>Mensagem: <input type="text" name="mensagem" id="mensagem"></p>
        </fieldset>
    </form>
</body>
<script src="js/main.js"></script>
</html>
